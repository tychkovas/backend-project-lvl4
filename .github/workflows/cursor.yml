name: cursor

on:
  # Комментарий с /oc|/cursor — осознанный privileged-триггер: job фильтрует
  # author_association (OWNER|MEMBER|COLLABORATOR) и не исполняет код PR.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cursor:
    # Комментарий агента — тоже issue_comment. Без фильтра по отправителю
    # ответ с /oc снова ставит этот job в очередь.
    # author_association: публичный репозиторий, звать агента могут только
    # владелец, участник организации и явные коллабораторы. CONTRIBUTOR
    # не входит: это любой, у кого уже есть коммит.
    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.user.login, '[bot]') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /cursor') ||
        startsWith(github.event.comment.body, '/cursor') ||
        contains(github.event.comment.body, ' /cu') ||
        startsWith(github.event.comment.body, '/cu')
      )
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        # Агенту нужен GITHUB_TOKEN в git config: коммитит и пушит через git/gh.
        # jactionlint ignore=artipacked
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Setup (deps, .env, migrations, skills)
        run: mise run setup

      - name: Install Cursor CLI
        shell: bash
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          {
            echo "Ты — автономный агент Cursor в GitHub Actions для репозитория ${REPOSITORY}."
            echo "Есть полный доступ к git, gh и рабочей копии. Можешь коммитить, пушить и открывать PR."
            echo ""
            echo "Контекст:"
            echo "- Issue/PR #${ISSUE_NUMBER}"
            echo "- Заголовок: ${ISSUE_TITLE}"
            echo "- Описание:"
            echo "${ISSUE_BODY}"
            echo ""
            echo "- Комментарий, который тебя вызвал:"
            echo "${COMMENT_BODY}"
            echo ""
            echo "Правила:"
            echo "- Все ответы, объяснения, ревью и комментарии — только на русском."
            echo "- Commit subject и PR title — только английский Conventional Commits: <type>: <subject>."
            echo "- Следуй AGENTS.md. Данные форм через Model.fromJson(); частичные обновления через patch(); creatorId неизменен; схема БД — только новыми миграциями."
            echo "- Проверки через mise (mise run check), когда уместно."
            echo "- В конце оставь комментарий к issue/PR через gh с кратким итогом на русском."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --force \
            --output-format text
