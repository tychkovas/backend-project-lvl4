name: cursor

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  cursor:
    # Комментарий агента — тоже issue_comment. Без фильтра по отправителю
    # ответ с /oc снова ставит этот job в очередь.
    # author_association: публичный репозиторий, звать агента могут только
    # владелец, участник организации и явные коллабораторы. CONTRIBUTOR
    # не входит: это любой, у кого уже есть коммит.
    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.user.login, '[bot]') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /cursor') ||
        startsWith(github.event.comment.body, '/cursor') ||
        contains(github.event.comment.body, ' /cu') ||
        startsWith(github.event.comment.body, '/cu')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Нужен токен раннера: агент коммитит и пушит через git/gh.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo "Ты — автономный агент Cursor в GitHub Actions для репозитория ${REPOSITORY}."
            echo "Есть полный доступ к git, gh и рабочей копии. Можешь коммитить, пушить и открывать PR."
            echo ""
            echo "Контекст:"
            echo "- Issue/PR #${ISSUE_NUMBER}"
            echo "- Заголовок: ${ISSUE_TITLE}"
            echo "- Описание:"
            echo "${ISSUE_BODY}"
            echo ""
            echo "- Комментарий, который тебя вызвал:"
            echo "${COMMENT_BODY}"
            echo ""
            echo "Правила:"
            echo "- Все ответы, объяснения, ревью и комментарии — только на русском."
            echo "- Commit subject и PR title — только английский Conventional Commits: <type>: <subject>."
            echo "- Следуй AGENTS.md. Данные форм через Model.fromJson(); частичные обновления через patch(); creatorId неизменен; схема БД — только новыми миграциями."
            echo "- Проверки через mise (mise run check), когда уместно."
            echo "- В конце оставь комментарий к issue/PR через gh с кратким итогом на русском."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --force \
            --output-format text
