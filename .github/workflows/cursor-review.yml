name: cursor-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # PR, открытые ботом, пропускаем — для них ревью запускают комментарием /oc или /cursor.
    if: >-
      github.event.sender.type != 'Bot' &&
      !contains(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor review
        id: review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            echo "Сделай ревью pull request #${PR_NUMBER} («${PR_TITLE}») относительно ветки ${BASE_REF}."
            echo "Ничего не коммить и не пушь — только анализ. Итоговый текст ревью выведи в stdout."
            echo ""
            echo "Критерии ревью:"
            echo "- Правила AGENTS.md: данные форм через Model.fromJson() с записью валидированного объекта, частичное обновление через patch(), creatorId задачи неизменен, схема БД меняется только новыми миграциями (SQL совместим с SQLite и PostgreSQL)"
            echo "- Готовые решения прежде своих: нет самописных плагинов/хуков там, где есть поддерживаемый аналог в npm"
            echo "- Проверки через mise (mise run check), а не прямой вызов npm-скриптов; ESM-сервер и .cjs-модели не смешаны"
            echo "- Потенциальные баги, граничные случаи, нарушения типов"
            echo "Все ответы, объяснения и ревью формируй только на русском языке."
          } > /tmp/cursor-prompt.txt

          agent -p "$(cat /tmp/cursor-prompt.txt)" \
            --model composer-2.5 \
            --trust \
            --mode ask \
            --output-format text \
            | tee /tmp/cursor-review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Ревью Cursor Agent"
            echo ""
            cat /tmp/cursor-review.md
          } > /tmp/cursor-review-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/cursor-review-comment.md
