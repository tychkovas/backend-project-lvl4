# mise управляет инструментами, окружением и задачами проекта
# https://mise.jdx.dev/

[tools]
node = "22.23.4"
jactionlint = "2.3.0"
shellcheck = "0.11.0"   # jactionlint прогоняет её по run: шагам workflow'ов

[env]
# сессия и прочие переменные лежат в .env (создаётся задачей setup)
_.file = { path = ".env", optional = true }

[hooks]
# зависимости ставятся сразу после установки тулчейна
postinstall = "npm install"

[tasks.setup]
description = "зависимости + .env + миграции"
run = ["npm install", "cp -n .env.example .env || true", "npx knex migrate:latest"]

[tasks.migrate]
description = "применить миграции knex"
run = "npx knex migrate:latest"

[tasks.lint]
description = "eslint"
run = "npx eslint --ext .js,.mjs ."

[tasks.test]
description = "jest (все тесты)"
run = "npm test"

[tasks.test-scripts]
description = "тесты скриптов (node --test)"
run = "node --test scripts/*.test.mjs"

[tasks.check-commits]
description = "темы коммитов — английский Conventional Commits"
run = "node scripts/check-commit-subjects.mjs"

[tasks.test-coverage]
description = "jest с coverage (для Code Climate в CI)"
run = "npx jest --coverage --runInBand"

[tasks.check]
description = "lint + test + линт workflow'ов — все проверки одной командой"
depends = ["lint", "test", "test-scripts", "lint-workflows"]

[tasks.lint-workflows]
description = "jactionlint по CI workflow'ам (hexlet-check.yml — автогенерированный, не проверяется)"
run = "jactionlint .github/workflows/nodejs.yml .github/workflows/cursor.yml .github/workflows/cursor-review.yml .github/workflows/cursor-triage.yml .github/workflows/pr-title.yml"

[tasks.start]
description = "dev-сервер (nodemon)"
run = "npx nodemon --exec server/bin/server.js"

[tasks.build]
description = "webpack-сборка фронтенда"
run = "npm run build"
